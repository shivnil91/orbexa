name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  javascript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg16
        env:
          POSTGRES_USER: orbexa
          POSTGRES_PASSWORD: orbexa_local_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orbexa -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.33.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the worker venv the slice test shells out to
        run: |
          python -m venv workers/ai/.venv
          workers/ai/.venv/bin/python -m pip install --upgrade "pip>=26.2"
          workers/ai/.venv/bin/python -m pip install -e "./workers/ai"
      - run: pnpm test
      - run: pnpm --filter @orbexa/db test:pg16
      - run: pnpm audit --audit-level=high

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade "pip>=26.2"
      - run: python -m pip install -e "./workers/ai[dev]" pip-audit
      - run: ruff check workers/ai
      - run: mypy
        working-directory: workers/ai
      - run: pytest
        working-directory: workers/ai
      - run: pip-audit

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Terraform 1.9.8
        run: |
          set -euo pipefail
          version=1.9.8
          curl -fsSL -o terraform.zip "https://releases.hashicorp.com/terraform/${version}/terraform_${version}_linux_amd64.zip"
          echo "186e0145f5e5f2eb97cbd785bc78f21bae4ef15119349f6ad4fa535b83b10df8  terraform.zip" | sha256sum -c -
          unzip -q terraform.zip
          mkdir -p "$HOME/.local/bin"
          mv terraform "$HOME/.local/bin/terraform"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: terraform fmt -check -recursive infra
      - name: Validate roots without contacting AWS
        run: |
          set -euo pipefail
          for dir in infra/bootstrap infra/modules/cell infra/modules/dev-stack infra/envs/dev infra/envs/staging infra/envs/prod; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
      - name: Check the deployer policy
        run: python3 infra/iam/check_policy.py
